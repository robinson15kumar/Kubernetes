apiVersion: apps/v1
kind: ReplicaSet
metadata: 
  name: my-rs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      name: nginx-pod
      labels:
        app: nginx
    spec:
      containers:
      - name: rs-container
        image: nginx
        ports:
        - containerPort: 80