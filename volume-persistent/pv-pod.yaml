apiVersion : v1
kind : Pod
metadata :
  name : pv-pod
spec :
  containers :
  - image : nginx
    name : pv-container
    ports :
    - containerPort : 80
    volumeMounts :
    - mountPath : /home
      name : myvolumepv
  volumes :
  - name : myvolumepv
    persistentVolumeClaim : 
      claimName : myvolumepvc
      readOnly : false