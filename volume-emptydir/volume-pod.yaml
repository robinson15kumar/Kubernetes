apiVersion : v1
kind : Pod
metadata :
  name : volume-pod
spec :
  volumes :
  - name : mem-volume
    emptyDir :
      sizeLimit : 500Mi
      medium : "Memory"
  containers :
  - image : nginx
    name : volume-container
    ports :
    - containerPort : 80
    volumeMounts :
    - mountPath : /home
      name : mem-volume